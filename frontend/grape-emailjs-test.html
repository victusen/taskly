<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bzade | Test GrapesJS template</title>
  <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.23.6/dist/css/grapes.min.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .bar { padding: 10px; display: flex; gap: 8px; align-items: center; }
    #blocks { padding: 10px; border-bottom: 1px solid #ddd; }
    #out { margin: 0; padding: 10px; white-space: pre-wrap; background: #f4f4f4; }
  </style>
</head>
<body>
  <div class="bar"><button id="show-html" type="button">Show HTML</button></div>
  <div id="blocks"></div>
  <div id="gjs"></div>
  <pre id="out"></pre>

  <script src="https://unpkg.com/grapesjs@0.23.6/dist/grapes.min.js"></script>
  <script>
    const editor = grapesjs.init({
      container: "#gjs",
      height: "420px",
      storageManager: false,
      blockManager: { appendTo: "#blocks" },
      components: "<h1>Hello from Bzade</h1><p>Start designing your email here.</p>",
    });

    editor.Blocks.add("paragraph", {
      label: "Paragraph",
      category: "Basic",
      content: '<p style="text-align: left;">Write your text here</p>',
    });

    document.getElementById("show-html").addEventListener("click", () => {
      document.getElementById("out").textContent = editor.getHtml();
    });
  </script>
</body>
</html>
