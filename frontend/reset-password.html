<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password - Bzade</title>
  <link rel="icon" type="image/png" href="logo-2.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="scripts/ui/toast.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    /* Clean minimal top brand bar like Render */
    header.reset-header {
      width: 100%;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #f3f4f6;
    }
    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #111827;
    }
    .brand-logo {
      height: 26px;
      width: auto;
    }
    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* Centered reset card */
    main.reset-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 80px;
      width: 100%;
    }
    .reset-card {
      width: 100%;
      max-width: 440px;
    }
    .reset-card h1 {
      font-size: 26px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .reset-subtext {
      font-size: 14px;
      color: #4b5563;
      margin-bottom: 24px;
      line-height: 1.45;
    }
    .reset-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 500;
      color: #111827;
    }
    /* Sharp clear border like Render */
    .render-input {
      width: 100%;
      background: transparent;
      border: 1px solid #d1d5db;
      border-radius: 2px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      color: #111827;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .render-input:focus {
      border-color: #111827;
      background: #ffffff;
    }
    .render-input::placeholder {
      color: #9ca3af;
    }
    /* Solid sharp black button like Render */
    .submit-btn {
      width: 100%;
      background: #111111;
      color: #ffffff;
      border: none;
      border-radius: 2px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 6px;
      transition: background-color 0.15s ease;
    }
    .submit-btn:hover {
      background: #262626;
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .assistance-text {
      margin-top: 24px;
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
    }
    .assistance-text a {
      color: #6366f1;
      text-decoration: none;
      font-weight: 500;
    }
    .assistance-text a:hover {
      text-decoration: underline;
    }
    .back-login {
      margin-top: 14px;
      font-size: 13px;
    }
    .back-login a {
      color: #111827;
      text-decoration: none;
    }
    .back-login a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Minimal Brand Header -->
  <header class="reset-header">
    <a href="index.html" class="brand-link">
      <img src="logo-bz.png" alt="Bzade" class="brand-logo" />
      <span class="brand-name">Bzade</span>
    </a>
  </header>

  <main class="reset-container">
    <div class="reset-card">
      <h1 id="page-title">Reset Your Password</h1>
      <p class="reset-subtext" id="page-subtitle">Enter your email address and we'll send you a password reset link.</p>

      <!-- Form 1: Request Password Reset Email (Default) -->
      <form id="request-reset-form" class="reset-form">
        <div class="form-group">
          <label for="reset-email">Email</label>
          <input
            id="reset-email"
            class="render-input"
            type="email"
            placeholder="your@email.com"
            autocomplete="email"
            required
          />
        </div>

        <button type="submit" id="request-btn" class="submit-btn">
          Reset Password
        </button>
      </form>

      <!-- Form 2: Update Password (When landing with recovery session/token) -->
      <form id="update-password-form" class="reset-form" style="display: none;">
        <div class="form-group">
          <label for="new-password">New password</label>
          <input
            id="new-password"
            class="render-input"
            type="password"
            placeholder="Enter new password"
            minlength="6"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm new password</label>
          <input
            id="confirm-password"
            class="render-input"
            type="password"
            placeholder="Confirm new password"
            minlength="6"
            required
          />
        </div>

        <button type="submit" id="update-btn" class="submit-btn">
          Update Password
        </button>
      </form>

      <p class="assistance-text">
        If you need further assistance, contact: <a href="mailto:Victor@bzade.app">Victor@bzade.app</a>
      </p>
      <p class="back-login">
        <a href="login.html">&larr; Back to Sign In</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="reset-password.js"></script>
</body>
</html>
