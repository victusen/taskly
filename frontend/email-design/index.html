<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Email design | Bzade</title>
  <link rel="icon" type="image/png" href="../logo-2.png">
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #111827;
      background: #fff;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: #fff; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .designer-shell {
      width: min(100%, 1500px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
      padding: 28px clamp(20px, 4vw, 56px) 48px clamp(140px, 15vw, 220px);
    }
    .brand { position: fixed; top: 28px; left: 32px; z-index: 2; display: inline-flex; align-items: center; }
    .brand img { display: block; width: 100px; height: auto; }
    main { width: min(1240px, 100%); margin: auto 0; padding: 24px 0; }
    .designer-card { padding: 24px; border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; box-shadow: 0 12px 40px rgba(17, 24, 39, .055); }
    .designer-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 20px; padding-bottom: 17px; border-bottom: 1px solid #e5e7eb; }
    .page-heading h1 { margin: 0; color: #111827; font-size: 25px; font-weight: 700; letter-spacing: -.025em; }
    .page-heading p { margin: 4px 0 0; color: #667085; font-size: 13px; }
    .heading-actions { display: flex; align-items: center; gap: 18px; }
    .status { color: #667085; font-size: 12px; white-space: nowrap; }
    .back-link { color: #344054; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; }
    .back-link:hover { color: #111827; text-decoration: underline; text-underline-offset: 3px; }
    .designer-form { display: grid; grid-template-columns: minmax(300px, .76fr) minmax(0, 1.24fr); align-items: start; gap: 18px; }
    .design-card { min-width: 0; padding: 17px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; }
    .card-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .card-heading h2 { margin: 0; color: #667085; font-size: 11px; font-weight: 700; letter-spacing: .075em; text-transform: uppercase; }
    .meta-fields { display: grid; gap: 17px; }
    .composition-column { display: grid; align-content: start; gap: 18px; min-width: 0; }
    .composition-column .meta-fields { gap: 14px; }
    .composition-column .meta-field { grid-template-columns: 120px minmax(0, 1fr); align-items: center; gap: 16px; }
    .meta-field { display: grid; gap: 7px; min-width: 0; }
    .field-label { color: #4b5563; font-size: 12px; font-weight: 650; letter-spacing: .035em; text-transform: uppercase; }
    .input { width: 100%; min-width: 0; height: 44px; padding: 0 13px; border: 1px solid #d1d5db; border-radius: 6px; outline: 0; color: #111827; background: #fff; font-size: 14px; transition: border-color .15s ease, box-shadow .15s ease; }
    .input::placeholder, .code-editor::placeholder { color: #c4c8d0; opacity: 1; }
    .input:focus { border-color: #111827; box-shadow: 0 0 0 3px rgba(17, 24, 39, .08); }
    .sender-control { display: flex; align-items: stretch; min-width: 0; gap: 8px; }
    .sender-control .input { flex: 1; }
    .use-project-name { flex: 0 0 auto; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px; color: #374151; background: #fff; font-size: 12px; font-weight: 600; }
    .use-project-name:hover { border-color: #9ca3af; background: #f9fafb; }
    .editor { display: flex; flex-direction: column; overflow: hidden; border: 1px solid #d1d5db; border-radius: 8px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #1f2937; background: #000; }
    .tool { padding: 6px 11px; border: 1px solid #1f2937; border-radius: 6px; color: #e5e7eb; background: #1f2937; font-size: 12px; font-weight: 400; transition: background .15s ease, color .15s ease, border-color .15s ease; }
    .tool:hover, .tool:focus-visible { border-color: #374151; background: #374151; color: #fff; }
    .tool:focus-visible { outline: 2px solid #e5e7eb; outline-offset: 2px; }
    .code-editor { display: block; width: 100%; min-height: 400px; height: min(56vh, 500px); padding: 16px; border: 0; outline: 0; resize: vertical; color: #111; background: #fff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }
    .cmp-assets { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 12px; border-top: 1px solid #d9d9d9; }
    .cmp-assets[hidden] { display: none; }
    .cmp-asset { display: flex; flex-direction: column; gap: 6px; padding: 6px; border: 1px solid #d9d9d9; border-radius: 6px; color: #111; background: #fff; font-size: 12px; text-align: left; }
    .cmp-asset:hover { border-color: #111; }
    .cmp-asset img { width: 100%; height: 90px; border-radius: 4px; background: #f5f5f5; object-fit: contain; }
    .cmp-asset span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview-panel { margin-top: 0; padding: 16px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fafafa; }
    .preview-panel[hidden] { display: none; }
    .preview-title { margin: 0 0 10px; color: #667085; font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
    .preview-frame { width: 100%; min-height: 300px; border: 0; background: #fff; }
    .form-footer { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 3px; }
    .message { min-height: 18px; color: #15803d; font-size: 12px; }
    .actions { display: flex; align-items: center; gap: 10px; }
    .button { min-height: 38px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 6px; color: #4b5563; background: #fff; font-size: 12px; font-weight: 550; }
    .button:hover { border-color: #9ca3af; background: #f3f4f6; color: #111827; }
    .button.primary { padding: 0 15px; border-color: #17191c; color: #fff; background: #17191c; font-size: 13px; font-weight: 600; }
    .button.primary:hover { background: #30343a; }
    @media (max-width: 860px) {
      .designer-shell { padding: 24px 20px 36px; }
      .brand { position: static; margin-bottom: 24px; }
      .brand img { width: 60px; }
      main { margin: 0; padding: 0; }
      .designer-form { grid-template-columns: 1fr; }
      .composition-column { gap: 12px; }
      .code-editor { min-height: 320px; height: 360px; }
    }
    @media (max-width: 560px) {
      .designer-shell { padding: 22px 14px 28px; }
      .brand { margin-bottom: 18px; }
      .designer-card { padding: 16px; border-radius: 8px; box-shadow: none; }
      .designer-head { align-items: flex-start; flex-direction: column; gap: 12px; }
      .heading-actions { width: 100%; justify-content: space-between; }
      .designer-form { gap: 12px; }
      .design-card { padding: 14px; }
      .composition-column .meta-field { grid-template-columns: 1fr; gap: 6px; }
      .sender-control { flex-wrap: wrap; }
      .sender-control .input { flex-basis: 100%; }
      .use-project-name { min-height: 36px; }
      .code-editor { min-height: 260px; height: 260px; }
      .form-footer { align-items: stretch; flex-direction: column; gap: 10px; }
      .actions { flex-wrap: wrap; }
      .actions .button { flex: 1; }
    }
  </style>
</head>
<body>
  <script type="module" src="/scripts/ui/feedbackButton.js"></script>
  <div class="designer-shell">
    <a class="brand" href="/" aria-label="Bzade home">
      <img src="../logo-bz.png" alt="Bzade">
    </a>
    <main>
      <section class="designer-card" aria-labelledby="email-design-title">
        <header class="designer-head">
          <div class="page-heading">
            <h1 id="email-design-title">Email design</h1>
            <p>Create and save a reusable email layout.</p>
          </div>
          <div class="heading-actions">
            <span class="status" id="save-status" role="status">Not saved</span>
            <a class="back-link" href="/dashboard">Back to dashboard</a>
          </div>
        </header>

        <form class="designer-form" id="template-form">
          <section class="design-card" aria-labelledby="template-details-title">
            <div class="card-heading">
              <h2 id="template-details-title">Template details</h2>
            </div>
            <div class="meta-fields">
              <label class="meta-field">
                <span class="field-label">Template name</span>
                <input class="input" name="name" maxlength="120" placeholder="Welcome Series" required>
              </label>
            </div>
          </section>

          <div class="composition-column">
            <section class="design-card" aria-label="Email message settings">
              <div class="meta-fields">
                <label class="meta-field">
                  <span class="field-label">Email subject</span>
                  <input class="input" name="subject" maxlength="300" placeholder="Your July update" required>
                </label>
                <div class="meta-field">
                  <label class="field-label" for="sender-name">Send as</label>
                  <span class="sender-control">
                    <input class="input" id="sender-name" name="sender_name" maxlength="100" placeholder="Sam from Bzade">
                    <button type="button" class="use-project-name" id="use-project-name">Use project name</button>
                  </span>
                </div>
              </div>
            </section>

            <section class="design-card" aria-labelledby="email-editor-title">
              <div class="card-heading">
                <h2 id="email-editor-title">Email design</h2>
              </div>
              <div class="editor">
                <div class="toolbar" role="toolbar" aria-label="Insert email content">
                  <button type="button" class="tool" data-insert="h1">H1</button>
                  <button type="button" class="tool" data-insert="p">P</button>
                  <button type="button" class="tool" data-insert="variable">Variable</button>
                  <button type="button" class="tool" data-insert="operation">Operation</button>
                  <button type="button" class="tool" data-insert="a">Link</button>
                  <button type="button" class="tool" data-insert="button">Button</button>
                  <button type="button" class="tool" data-insert="img">Image</button>
                  <button type="button" class="tool" data-insert="column">Column</button>
                  <button type="button" class="tool" data-insert="row">Row</button>
                  <button type="button" class="tool" id="cmp-upload-btn">Upload asset</button>
                  <button type="button" class="tool" id="cmp-assets-toggle" aria-expanded="false">Assets (<span id="cmp-asset-count">0</span>)</button>
                  <input id="cmp-file" type="file" accept="image/*" hidden>
                </div>
                <textarea class="code-editor" id="template-body" name="body" spellcheck="false" placeholder="<p>Write your message here.</p>" required></textarea>
                <div class="cmp-assets" id="cmp-assets" hidden></div>
              </div>
              <div class="preview-panel" id="preview-panel" hidden>
                <p class="preview-title">Preview</p>
                <iframe class="preview-frame" id="preview-frame" sandbox="allow-same-origin" title="Email preview"></iframe>
              </div>
            </section>
          </div>

          <div class="form-footer">
            <span class="message" id="form-message" role="status"></span>
            <div class="actions">
              <button type="button" class="button" id="preview-button" aria-expanded="false">Preview</button>
              <button type="button" class="button" id="save-button">Save draft</button>
              <button type="submit" class="button primary">Save template</button>
            </div>
          </div>
        </form>
      </section>
    </main>
  </div>
  <script type="module" src="/email-design/email-design.js"></script>
</body>
</html>
